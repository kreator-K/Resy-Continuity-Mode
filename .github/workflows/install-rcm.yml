name: Install full-stack RCM application
on:
  push:
    paths:
      - .rcm-import/application.tar.xz.base64
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified application package
        run: |
          mkdir -p legacy
          cp index.html legacy/index.html
          base64 --decode .rcm-import/application.tar.xz.base64 | tar xJ
          rm .rcm-import/application.tar.xz.base64
          rmdir .rcm-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install full-stack continuity mode app and preserve original demo"
          git push
